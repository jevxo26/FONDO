<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FONDO</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #18181b;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    .email-wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    .email-container {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
    }
    .email-header {
      background: #18181b;
      padding: 32px 40px 24px;
      text-align: center;
    }
    .email-header h1 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .email-header .tagline {
      color: #a1a1aa;
      font-size: 14px;
      margin-top: 4px;
    }
    .email-body {
      padding: 32px 40px;
    }
    .email-footer {
      padding: 24px 40px;
      background: #fafafa;
      text-align: center;
      border-top: 1px solid #e4e4e7;
    }
    .email-footer p {
      color: #71717a;
      font-size: 12px;
      margin: 4px 0;
    }
    .email-footer a {
      color: #a855f7;
      text-decoration: none;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
    }
    .btn-primary {
      background: #a855f7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #9333ea;
    }
    .order-table {
      width: 100%;
      margin-top: 16px;
    }
    .order-table th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      color: #71717a;
      padding: 8px 0;
      border-bottom: 1px solid #e4e4e7;
    }
    .order-table td {
      padding: 10px 0;
      border-bottom: 1px solid #f4f4f5;
      font-size: 14px;
    }
    .order-table .text-right {
      text-align: right;
    }
    .total-row td {
      font-weight: 700;
      font-size: 16px;
      border-bottom: none;
      padding-top: 14px;
    }
  </style>
</head>
<body>
  <table role="presentation" class="email-wrapper">
    <tr>
      <td align="center">
        <table role="presentation" class="email-container">
          <tr>
            <td class="email-header">
              <h1>FONDO</h1>
              <p class="tagline">Smart Subscription Food Delivery</p>
            </td>
          </tr>
          <tr>
            <td class="email-body">
              {{{body}}}
            </td>
          </tr>
          <tr>
            <td class="email-footer">
              <p>&copy; 2026 FONDO. All rights reserved.</p>
              <p>123 Gulshan Avenue, Dhaka, Bangladesh</p>
              <p>
                <a href="{{unsubscribeUrl}}">Unsubscribe</a> &middot;
                <a href="{{supportUrl}}">Support</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
